name: Configure Jira Demo Fields

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Populate Jira source fields
        env:
          JIRA_BASE_URL: https://joshjohanning.atlassian.net
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH_ARGS=(--user "$JIRA_EMAIL:$JIRA_TOKEN")

          update_issue() {
            local key="$1"
            local story_points="$2"
            local product_category_option="$3"
            local payload
            payload="$(jq -n \
              --argjson points "$story_points" \
              --arg category "$product_category_option" \
              '{
                fields: {
                  priority: {id: "3"},
                  customfield_10218: {id: "10025"},
                  customfield_10219: {id: $category},
                  customfield_10220: "Wally",
                  customfield_10221: {id: "10033"},
                  customfield_10222: $points
                }
              }')"

            curl --fail-with-body --silent --show-error \
              "${AUTH_ARGS[@]}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --request PUT \
              --data "$payload" \
              "$JIRA_BASE_URL/rest/api/3/issue/$key" \
              > /dev/null
            echo "Updated $key"
          }

          update_issue GHAW-1 3 10028
          update_issue GHAW-2 5 10029
          update_issue GHAW-3 2 10028
