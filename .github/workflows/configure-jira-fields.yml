name: Configure Jira Demo Fields

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Create and populate Jira fields
        env:
          JIRA_BASE_URL: https://joshjohanning.atlassian.net
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$JIRA_EMAIL" ]]; then
            AUTH_ARGS=(--user "$JIRA_EMAIL:$JIRA_TOKEN")
          else
            AUTH_ARGS=(--header "Authorization: Bearer $JIRA_TOKEN")
          fi

          jira_get() {
            curl --fail-with-body --silent --show-error \
              "${AUTH_ARGS[@]}" \
              --header "Accept: application/json" \
              "$JIRA_BASE_URL$1"
          }

          jira_post() {
            curl --fail-with-body --silent --show-error \
              "${AUTH_ARGS[@]}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --request POST \
              --data "$2" \
              "$JIRA_BASE_URL$1"
          }

          fields="$(jira_get /rest/api/3/field)"

          ensure_field() {
            local name="$1"
            local type="$2"
            local searcher="$3"
            local id
            id="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .id' <<<"$fields" | head -1)"
            if [[ -z "$id" ]]; then
              id="$(jira_post /rest/api/3/field "$(jq -n \
                --arg name "$name" \
                --arg type "$type" \
                --arg searcherKey "$searcher" \
                '{name: $name, description: "GitHub Agentic Workflows demo field", type: $type, searcherKey: $searcherKey}')" \
                | jq -r .id)"
              fields="$(jira_get /rest/api/3/field)"
              echo "Created $name as $id" >&2
            else
              echo "Using existing $name as $id" >&2
            fi
            printf '%s' "$id"
          }

          PI_ID="$(ensure_field "PI" \
            "com.atlassian.jira.plugin.system.customfieldtypes:textfield" \
            "com.atlassian.jira.plugin.system.customfieldtypes:textsearcher")"
          SPRINT_ID="$(ensure_field "Sprint" \
            "com.atlassian.jira.plugin.system.customfieldtypes:textfield" \
            "com.atlassian.jira.plugin.system.customfieldtypes:textsearcher")"
          STORY_POINTS_ID="$(ensure_field "Story Pts" \
            "com.atlassian.jira.plugin.system.customfieldtypes:float" \
            "com.atlassian.jira.plugin.system.customfieldtypes:exactnumber")"
          SOURCE_ID="$(ensure_field "Source" \
            "com.atlassian.jira.plugin.system.customfieldtypes:select" \
            "com.atlassian.jira.plugin.system.customfieldtypes:multiselectsearcher")"
          REQUESTED_BY_ID="$(ensure_field "Requested by" \
            "com.atlassian.jira.plugin.system.customfieldtypes:textfield" \
            "com.atlassian.jira.plugin.system.customfieldtypes:textsearcher")"
          PRODUCT_CATEGORY_ID="$(ensure_field "Product category" \
            "com.atlassian.jira.plugin.system.customfieldtypes:select" \
            "com.atlassian.jira.plugin.system.customfieldtypes:multiselectsearcher")"

          ensure_options() {
            local field_id="$1"
            shift
            local context_id
            context_id="$(jira_get "/rest/api/3/field/$field_id/context" | jq -r '.values[0].id')"
            local existing
            existing="$(jira_get "/rest/api/3/field/$field_id/context/$context_id/option" | jq -r '.values[].value')"
            local options='[]'
            local value
            for value in "$@"; do
              if ! grep -Fxq "$value" <<<"$existing"; then
                options="$(jq --arg value "$value" '. + [{value: $value}]' <<<"$options")"
              fi
            done
            if [[ "$(jq length <<<"$options")" -gt 0 ]]; then
              jira_post "/rest/api/3/field/$field_id/context/$context_id/option" \
                "$(jq -n --argjson options "$options" '{options: $options}')" \
                > /dev/null
            fi
          }

          ensure_options "$SOURCE_ID" "Jira" "GitHub"
          ensure_options "$PRODUCT_CATEGORY_ID" "Notifications" "Tracking" "Platform"

          update_issue() {
            local key="$1"
            local points="$2"
            local category="$3"
            local payload
            payload="$(jq -n \
              --arg pi_id "$PI_ID" \
              --arg sprint_id "$SPRINT_ID" \
              --arg points_id "$STORY_POINTS_ID" \
              --arg source_id "$SOURCE_ID" \
              --arg requested_by_id "$REQUESTED_BY_ID" \
              --arg category_id "$PRODUCT_CATEGORY_ID" \
              --argjson points "$points" \
              --arg category "$category" \
              '{
                fields: {
                  ($pi_id): "PI 1",
                  ($sprint_id): "Sprint 1",
                  ($points_id): $points,
                  ($source_id): {value: "Jira"},
                  ($requested_by_id): "Wally",
                  ($category_id): {value: $category}
                }
              }')"

            curl --fail-with-body --silent --show-error \
              "${AUTH_ARGS[@]}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --request PUT \
              --data "$payload" \
              "$JIRA_BASE_URL/rest/api/3/issue/$key?overrideScreenSecurity=true" \
              > /dev/null
            echo "Updated $key"
          }

          update_issue GHAW-1 3 Notifications
          update_issue GHAW-2 5 Tracking
          update_issue GHAW-3 2 Notifications
