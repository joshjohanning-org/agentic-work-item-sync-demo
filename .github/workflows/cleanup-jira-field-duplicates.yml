name: Cleanup Jira Field Duplicates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete duplicate custom fields
        env:
          JIRA_BASE_URL: https://joshjohanning.atlassian.net
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH_ARGS=(--user "$JIRA_EMAIL:$JIRA_TOKEN")
          for field_id in \
            customfield_10207 \
            customfield_10212 \
            customfield_10213 \
            customfield_10214 \
            customfield_10215 \
            customfield_10216 \
            customfield_10217
          do
            status="$(curl --silent --show-error \
              --output /tmp/jira-delete-response \
              --write-out '%{http_code}' \
              "${AUTH_ARGS[@]}" \
              --request DELETE \
              "$JIRA_BASE_URL/rest/api/3/field/$field_id")"
            if [[ "$status" == "204" || "$status" == "303" ]]; then
              echo "Deleted $field_id"
            elif [[ "$status" == "404" ]]; then
              echo "$field_id already absent"
            else
              cat /tmp/jira-delete-response
              exit 1
            fi
          done
